[project]
name = "chemmed-ingest"
version = "0.1.0"
description = "Ingestion + cheminformatics pipeline for the polypharmacology knowledge graph"
readme = "README.md"
# RDKit wheels lag the newest CPython. 3.12 is the safe target as of writing;
# the machine's 3.14 will not have RDKit wheels yet.
requires-python = ">=3.11,<3.13"

dependencies = [
    "rdkit>=2024.3.1",
    "polars>=1.0",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# FPSim2 provides the fast on-disk similarity index. Optional because the
# pure-numpy backend in chem/similarity.py is a working (if slower) fallback.
fpsim = ["FPSim2>=0.5.0"]
kafka = ["confluent-kafka>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chemmed-ingest = "chemmed_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemmed_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
