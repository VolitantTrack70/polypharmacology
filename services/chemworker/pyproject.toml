[project]
name = "chemmed-chemworker"
version = "0.1.0"
description = "gRPC cheminformatics service: standardisation and Tanimoto search"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "protobuf>=5.27",
    "numpy>=2.0",
    "rdkit>=2024.3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # Shares standardisation and search code with the pipeline so index and
    # query can never diverge.
    "chemmed-ingest",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.66", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
chemmed-chemworker = "chemworker.server:main"

[tool.uv.sources]
chemmed-ingest = { path = "../ingest", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemworker"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated protobuf stubs are not ours to lint.
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

# Kept identical to services/ingest so the two Python packages do not drift.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
