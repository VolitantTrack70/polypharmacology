name: chemmed

services:
  # ---------------------------------------------------------------
  # PostgreSQL + Apache AGE.
  # Holds both the relational bioactivity tables and the AGE graph.
  # NOTE: verify the image tag against https://hub.docker.com/r/apache/age/tags
  # for your desired Postgres major version before first run.
  # ---------------------------------------------------------------
  postgres:
    image: apache/age:latest
    container_name: chemmed-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chemmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-chemmed}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations are applied by `task migrate`, not auto-run, so that
      # re-running compose never silently mutates a loaded database.
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chemmed} -d ${POSTGRES_DB:-chemmed}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 1gb
    command:
      - postgres
      # Bulk-load friendly. Tune for your machine; these assume >=16GB RAM.
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=256MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=4GB

  # ---------------------------------------------------------------
  # Kafka in KRaft mode (no Zookeeper).
  # Used as the work-distribution log for parallel fingerprinting.
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: chemmed-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fingerprint batches are chunky; raise default message ceiling.
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      CLUSTER_ID: chemmed-local-cluster-0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
